name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          # [CUSTOM] 更新后镜像保留与失败保护回归，使用假Docker，不连接Docker daemon。
          /bin/bash -n deploy/update.sh
          /bin/bash deploy/tests/update-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    # [CUSTOM] 包号真实事务／并发回归使用独立空库，缺少DSN不能只靠skip冒充通过。
    services:
      # [CUSTOM] 分组门槛／跨实例缓存回归使用专用数据库，避免真实PG测试跳过。
      group-access-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: group_access_test
          POSTGRES_PASSWORD: group_access_ci_only
          POSTGRES_DB: group_access_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U group_access_test -d group_access_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # [CUSTOM] 认证 IP 黑名单事务／永久状态与滑动窗口回归使用专用存储。
      auth-ip-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auth_ip_test
          POSTGRES_PASSWORD: auth_ip_ci_only
          POSTGRES_DB: auth_ip_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U auth_ip_test -d auth_ip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      auth-ip-redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dedicated-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dedicated_test
          POSTGRES_PASSWORD: dedicated_ci_only
          POSTGRES_DB: dedicated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dedicated_test -d dedicated_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          # [CUSTOM] 安全检查与发布均验证修复后的工具链。
          go version | grep -q 'go1.27.2'
      - name: Unit tests
        working-directory: backend
        env:
          CUSTOM_GROUP_ACCESS_TEST_DSN: postgres://group_access_test:group_access_ci_only@127.0.0.1:5434/group_access_test?sslmode=disable
          DEDICATED_TEST_POSTGRES_DSN: postgres://dedicated_test:dedicated_ci_only@127.0.0.1:5432/dedicated_test?sslmode=disable
          AUTH_IP_TEST_POSTGRES_DSN: postgres://auth_ip_test:auth_ip_ci_only@127.0.0.1:5433/auth_ip_test?sslmode=disable
          AUTH_IP_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      # [CUSTOM] 配方与工坊的 node:test 回归，原先只在本机运行。
      - name: Family products node tests
        run: make test-family-products

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          # [CUSTOM] 静态检查同样使用安全补丁工具链。
          go version | grep -q 'go1.27.2'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # [CUSTOM] v2.13 无法读取安全工具链导出数据，固定支持该格式的版本。
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
