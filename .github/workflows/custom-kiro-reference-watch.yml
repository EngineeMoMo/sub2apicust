name: Kiro 参考项目巡检

on:
  push:
    paths:
      - tools/kiro/**
      - .github/workflows/custom-kiro-reference-watch.yml
  pull_request:
    paths:
      - tools/kiro/**
      - .github/workflows/custom-kiro-reference-watch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-kiro-reference-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 巡检离线回归
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test tools/kiro/check-updates.test.mjs

  watch:
    name: 检查上游（退出2表示新变化待审）
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 恢复观察游标
        id: state
        uses: actions/cache/restore@v6
        with:
          path: output/kiro-reference-watch/state.json
          key: kiro-watch-v1-${{ hashFiles('tools/kiro/sources.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kiro-watch-v1-${{ hashFiles('tools/kiro/sources.lock.json') }}-
      - name: 只读检查 GitHub 提交与发布
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/kiro/check-updates.mjs --fail-on-update
      - name: 保存巡检报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kiro-reference-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/kiro-reference-watch/*.json
            output/kiro-reference-watch/*.md
          if-no-files-found: warn
          retention-days: 30
      - name: 保存观察游标（不推进审阅或移植基线）
        if: always() && !cancelled() && steps.inspect.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: output/kiro-reference-watch/state.json
          key: ${{ steps.state.outputs.cache-primary-key }}
