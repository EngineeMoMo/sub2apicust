<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>程序动效录制 · 魔法工坊（本机）</title>
<link rel="stylesheet" href="./record.css">
<script type="module" src="./record.mjs"></script>
</head>
<body>
<header><h1>程序动效录制（本机夹具）</h1><p>按原图逐帧生成局部动态并录成 MP4；主体不动，不是视频模型生成。窗格需保持可见，否则计时会变慢。</p></header>
<div class="bar"><label>配方<select id="recipe"></select></label><button id="preview" type="button">预览循环</button><button id="record" type="button">录制并保存</button><span id="status" role="status" aria-live="polite"></span></div>
<canvas id="stage"></canvas>
<pre id="info"></pre>
</body>
</html>
